<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>代谢安全在线药物库</title>
  <meta name="description" content="在线检索融合后的公开药物、相互作用、剂量规则与来源证据。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-shell header-band">
    <div class="brand-row">
      <div class="brand-mark" aria-hidden="true">MS</div>
      <div>
        <h1>代谢安全在线药物库</h1>
        <p id="apiMeta">正在连接静态 API...</p>
      </div>
    </div>
    <nav class="top-links" aria-label="静态 API 链接">
      <a href="api/manifest.json">Manifest</a>
      <a href="api/sources/index.json">数据源</a>
      <a href="api/packages/full/manifest.json">标准化融合包</a>
    </nav>
  </header>

  <main class="app-shell">
    <section class="search-panel" aria-label="药物在线检索">
      <label for="searchInput">在线搜索药物中文名、英文名、别名或本体 ID</label>
      <div class="search-row">
        <input id="searchInput" type="search" autocomplete="off" placeholder="例如：劳拉西泮 / Lorazepam / warfarin / caffeine">
        <button id="clearSearch" type="button">清空</button>
      </div>
      <div id="statusLine" class="status-line" role="status">等待加载线上索引</div>
    </section>

    <section class="stats-grid" aria-label="线上库统计">
      <div><span>药物实体</span><strong id="substanceCount">0</strong></div>
      <div><span>相互作用</span><strong id="interactionCount">0</strong></div>
      <div><span>剂量规则</span><strong id="doseCount">0</strong></div>
      <div><span>数据来源</span><strong id="sourceCount">0</strong></div>
    </section>

    <section class="content-grid">
      <div class="results-column">
        <div class="section-title">
          <h2>搜索结果</h2>
          <span id="resultCount">0 条</span>
        </div>
        <div id="results" class="result-list empty">索引加载中...</div>
      </div>

      <div class="detail-column">
        <div class="section-title">
          <h2>药物详情</h2>
          <span id="detailBadge">未选择</span>
        </div>
        <article id="detail" class="detail-card empty">选择左侧药物后，会在线读取该药物的 PK 摘要、相互作用、剂量规则和证据来源。</article>
      </div>
    </section>
  </main>

  <footer class="app-shell footer-note">
    <p>此页面直接读取仓库托管的静态 JSON API。线上包是标准化后的融合索引与证据摘要，不包含 DailyMed、openFDA 等上游原始 XML/JSON 镜像。数据用于个人记录与工程验证，不替代医生、药师或正式临床决策支持系统。</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
