name: Build Static Drug API

on:
  workflow_dispatch:
  schedule:
    - cron: "23 19 * * 0"
  push:
    paths:
      - "data/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-data-api.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: python -m pip install -e .

      - name: Test ETL
        run: python -m unittest discover -s tests

      - name: Build fused seed database
        shell: bash
        run: |
          set -euo pipefail
          if find data/raw/ddinter -type f -name '*.csv' 2>/dev/null | grep -q .; then
            python -m metabolic_safety_etl.cli import-ddinter --input-dir data/raw/ddinter --out build
          else
            python -m metabolic_safety_etl.cli demo --out build
          fi

      - name: Export static JSON API
        run: python -m metabolic_safety_etl.cli export-static-api --input-dir build --out public/api

      - name: Write Pages landing page
        shell: bash
        run: |
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metabolic Safety Static API</title></head>
          <body style="font-family:system-ui,sans-serif;max-width:820px;margin:40px auto;line-height:1.55;padding:0 18px">
            <h1>Metabolic Safety Static API</h1>
            <p>This is a GitHub Pages hosted static JSON API. The client reads <code>/api/search/index.json</code> and filters locally.</p>
            <ul>
              <li><a href="api/manifest.json">api/manifest.json</a></li>
              <li><a href="api/search/index.json">api/search/index.json</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
