name: Build Static Drug API

on:
  workflow_dispatch:
  schedule:
    - cron: "23 19 * * 0"
  push:
    paths:
      - "data/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-data-api.yml"
      - "site/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: python -m pip install -e .

      - name: Test ETL
        run: python -m unittest discover -s tests

      - name: Build fused seed database and static API
        shell: bash
        run: |
          set -euo pipefail
          python -m metabolic_safety_etl.cli build-public-api \
            --ddinter-dir data/raw/ddinter \
            --out build \
            --api-out public/api \
            --max-public-terms 120 \
            --public-limit 2 \
            --public-workers 8 \
            --psychonautwiki-pages 3

      - name: Copy search web UI
        shell: bash
        run: cp -R site/. public/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
