name: Build Static Drug API

on:
  workflow_dispatch:
    inputs:
      stream_raw_sources:
        description: "Download remote bulk packages one part at a time during this run"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      raw_stream_sources:
        description: "Comma-separated bulk sources"
        required: true
        default: "openfda_label,dailymed,chembl,foodrugs,onsides,pharmgkb"
      raw_max_records:
        description: "Max parsed records per raw source; 0 means no cap"
        required: true
        default: "0"
      raw_stream_max_parts:
        description: "Max downloaded parts per raw source; 0 means all parts"
        required: true
        default: "0"
  schedule:
    - cron: "23 19 * * 0"
  push:
    paths:
      - "data/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-data-api.yml"
      - "site/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      STREAM_RAW_SOURCES: ${{ github.event_name == 'workflow_dispatch' && inputs.stream_raw_sources || 'false' }}
      RAW_STREAM_SOURCES: ${{ github.event_name == 'workflow_dispatch' && inputs.raw_stream_sources || 'openfda_label,dailymed,chembl,foodrugs,onsides,pharmgkb' }}
      RAW_MAX_RECORDS: ${{ github.event_name == 'workflow_dispatch' && inputs.raw_max_records || '100000' }}
      RAW_STREAM_MAX_PARTS: ${{ github.event_name == 'workflow_dispatch' && inputs.raw_stream_max_parts || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: python -m pip install -e .

      - name: Test ETL
        run: python -m unittest discover -s tests

      - name: Build fused seed database and static API
        shell: bash
        run: |
          set -euo pipefail
          raw_args=()
          if [[ "${STREAM_RAW_SOURCES}" == "true" ]]; then
            raw_args+=(--stream-raw-sources)
            raw_args+=(--raw-stream-sources "${RAW_STREAM_SOURCES}")
            raw_args+=(--raw-stream-max-parts "${RAW_STREAM_MAX_PARTS}")
            raw_args+=(--raw-stream-temp-dir "${RUNNER_TEMP}/metabolic-raw-stream")
          fi
          python -m metabolic_safety_etl.cli build-public-api \
            --ddinter-dir data/raw/ddinter \
            --out build \
            --api-out public/api \
            --max-public-terms 120 \
            --public-limit 2 \
            --public-workers 8 \
            --psychonautwiki-pages 3 \
            --raw-max-records "${RAW_MAX_RECORDS}" \
            "${raw_args[@]}"

      - name: Copy search web UI
        shell: bash
        run: cp -R site/. public/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4