name: Build Static Drug API

on:
  workflow_dispatch:
    inputs:
      raw_max_records:
        description: "Debug cap per source; 0 means full source"
        required: true
        default: "0"
      raw_stream_max_parts:
        description: "Debug cap per source; 0 means all upstream parts"
        required: true
        default: "0"
      max_content_per_substance:
        description: "Maximum content/signal/PGx rows exported per substance; 0 exports all"
        required: true
        default: "24"
  schedule:
    - cron: "23 19 * * 0"
  push:
    paths:
      - "data/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-data-api.yml"
      - "site/**"
      - "tools/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ALL_BULK_SOURCES: openfda_label,dailymed,chembl,foodrugs,onsides,pharmgkb
  DEFAULT_MAX_CONTENT_PER_SUBSTANCE: "24"

jobs:
  test-etl:
    name: Test ETL and overlay code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: python -m pip install -e .

      - name: Test ETL
        run: python -m unittest discover -s tests

  source-layer-cache:
    name: Build/cache source layer (${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        source:
          - openfda_label
          - dailymed
          - chembl
          - foodrugs
          - onsides
          - pharmgkb
    env:
      RAW_MAX_RECORDS: ${{ github.event_name == 'workflow_dispatch' && inputs.raw_max_records || '0' }}
      RAW_STREAM_MAX_PARTS: ${{ github.event_name == 'workflow_dispatch' && inputs.raw_stream_max_parts || '0' }}
      SOURCE_CACHE_DIR: .cache/metabolic-source-facts/${{ matrix.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: python -m pip install -e .

      - name: Resolve upstream manifest fingerprint
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/manifests"
          python -m metabolic_safety_etl.cli remote-manifests             --sources "${{ matrix.source }}"             --out "${RUNNER_TEMP}/manifests/${{ matrix.source }}.json"
          fingerprint=$(python - <<'PY'
          import json, os
          source = os.environ["SOURCE"]
          path = os.environ["MANIFEST_PATH"]
          with open(path, encoding="utf-8") as handle:
              payload = json.load(handle)
          print(payload["sources"][source]["fingerprint"])
          PY
          )
          echo "fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"
          echo "fingerprint=${fingerprint}"
        env:
          SOURCE: ${{ matrix.source }}
          MANIFEST_PATH: ${{ runner.temp }}/manifests/${{ matrix.source }}.json

      - name: Restore structured source layer cache
        id: source-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SOURCE_CACHE_DIR }}
          key: metabolic-source-facts-${{ runner.os }}-${{ matrix.source }}-${{ steps.manifest.outputs.fingerprint }}-${{ hashFiles('src/metabolic_safety_etl/**/*.py', 'pyproject.toml') }}-records-${{ env.RAW_MAX_RECORDS }}-parts-${{ env.RAW_STREAM_MAX_PARTS }}

      - name: Build structured source layer when upstream changed
        if: ${{ steps.source-cache.outputs.cache-hit != 'true' || hashFiles(format('.cache/metabolic-source-facts/{0}/evidence_facts.json', matrix.source)) == '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${SOURCE_CACHE_DIR}"
          mkdir -p "${SOURCE_CACHE_DIR}"
          python -m metabolic_safety_etl.cli build-remote-source-facts             --sources "${{ matrix.source }}"             --out "${SOURCE_CACHE_DIR}/evidence_facts.json"             --summary-out "${SOURCE_CACHE_DIR}/summary.json"             --temp-dir "${RUNNER_TEMP}/metabolic-raw-stream/${{ matrix.source }}"             --raw-max-records "${RAW_MAX_RECORDS}"             --raw-stream-max-parts "${RAW_STREAM_MAX_PARTS}"

      - name: Print source layer status
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "${SOURCE_CACHE_DIR}/summary.json" ]]; then
            python -m json.tool "${SOURCE_CACHE_DIR}/summary.json" | head -200
          fi
          if [[ -f "${SOURCE_CACHE_DIR}/evidence_facts.json" ]]; then
            bytes=$(wc -c < "${SOURCE_CACHE_DIR}/evidence_facts.json")
            echo "source_layer=${{ matrix.source }} bytes=${bytes}"
          fi

  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs:
      - test-etl
      - source-layer-cache
    env:
      RAW_MAX_RECORDS: ${{ github.event_name == 'workflow_dispatch' && inputs.raw_max_records || '0' }}
      RAW_STREAM_MAX_PARTS: ${{ github.event_name == 'workflow_dispatch' && inputs.raw_stream_max_parts || '0' }}
      MAX_CONTENT_PER_SUBSTANCE: ${{ github.event_name == 'workflow_dispatch' && inputs.max_content_per_substance || '24' }}
    if: ${{ always() && !cancelled() && needs.test-etl.result == 'success' && needs.source-layer-cache.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: python -m pip install -e .

      - name: Resolve all upstream manifest fingerprints
        id: manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/manifests"
          python -m metabolic_safety_etl.cli remote-manifests             --sources "${ALL_BULK_SOURCES}"             --out "${RUNNER_TEMP}/manifests/all.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "manifests", "all.json")
          with open(path, encoding="utf-8") as handle:
              payload = json.load(handle)
          for source, row in payload["sources"].items():
              print(f"{source}={row['fingerprint']}")
          PY

      - name: Restore openFDA source layer
        uses: actions/cache/restore@v4
        with:
          path: .cache/metabolic-source-facts/openfda_label
          key: metabolic-source-facts-${{ runner.os }}-openfda_label-${{ steps.manifests.outputs.openfda_label }}-${{ hashFiles('src/metabolic_safety_etl/**/*.py', 'pyproject.toml') }}-records-${{ env.RAW_MAX_RECORDS }}-parts-${{ env.RAW_STREAM_MAX_PARTS }}
          fail-on-cache-miss: true

      - name: Restore DailyMed source layer
        uses: actions/cache/restore@v4
        with:
          path: .cache/metabolic-source-facts/dailymed
          key: metabolic-source-facts-${{ runner.os }}-dailymed-${{ steps.manifests.outputs.dailymed }}-${{ hashFiles('src/metabolic_safety_etl/**/*.py', 'pyproject.toml') }}-records-${{ env.RAW_MAX_RECORDS }}-parts-${{ env.RAW_STREAM_MAX_PARTS }}
          fail-on-cache-miss: true

      - name: Restore ChEMBL source layer
        uses: actions/cache/restore@v4
        with:
          path: .cache/metabolic-source-facts/chembl
          key: metabolic-source-facts-${{ runner.os }}-chembl-${{ steps.manifests.outputs.chembl }}-${{ hashFiles('src/metabolic_safety_etl/**/*.py', 'pyproject.toml') }}-records-${{ env.RAW_MAX_RECORDS }}-parts-${{ env.RAW_STREAM_MAX_PARTS }}
          fail-on-cache-miss: true

      - name: Restore FooDrugs source layer
        uses: actions/cache/restore@v4
        with:
          path: .cache/metabolic-source-facts/foodrugs
          key: metabolic-source-facts-${{ runner.os }}-foodrugs-${{ steps.manifests.outputs.foodrugs }}-${{ hashFiles('src/metabolic_safety_etl/**/*.py', 'pyproject.toml') }}-records-${{ env.RAW_MAX_RECORDS }}-parts-${{ env.RAW_STREAM_MAX_PARTS }}
          fail-on-cache-miss: true

      - name: Restore OnSIDES source layer
        uses: actions/cache/restore@v4
        with:
          path: .cache/metabolic-source-facts/onsides
          key: metabolic-source-facts-${{ runner.os }}-onsides-${{ steps.manifests.outputs.onsides }}-${{ hashFiles('src/metabolic_safety_etl/**/*.py', 'pyproject.toml') }}-records-${{ env.RAW_MAX_RECORDS }}-parts-${{ env.RAW_STREAM_MAX_PARTS }}
          fail-on-cache-miss: true

      - name: Restore PharmGKB source layer
        uses: actions/cache/restore@v4
        with:
          path: .cache/metabolic-source-facts/pharmgkb
          key: metabolic-source-facts-${{ runner.os }}-pharmgkb-${{ steps.manifests.outputs.pharmgkb }}-${{ hashFiles('src/metabolic_safety_etl/**/*.py', 'pyproject.toml') }}-records-${{ env.RAW_MAX_RECORDS }}-parts-${{ env.RAW_STREAM_MAX_PARTS }}
          fail-on-cache-miss: true

      - name: Verify all structured source layers are present
        shell: bash
        run: |
          set -euo pipefail
          for source in openfda_label dailymed chembl foodrugs onsides pharmgkb; do
            test -s ".cache/metabolic-source-facts/${source}/evidence_facts.json"
            echo "ready ${source} $(wc -c < ".cache/metabolic-source-facts/${source}/evidence_facts.json") bytes"
          done

      - name: Build base seed database and static API
        shell: bash
        run: |
          set -euo pipefail
          # Keep the fused seed build bounded: large label/signal source layers are streamed
          # into overlay shards in the next step instead of being loaded into memory here.
          python -m metabolic_safety_etl.cli build-public-api \
            --ddinter-dir data/raw/ddinter \
            --out build \
            --api-out public/api \
            --skip-raw-sources \
            --max-public-terms 120 \
            --public-limit 2 \
            --public-workers 8 \
            --psychonautwiki-pages 3 \
            --extra-facts data/optional \
            --extra-facts data/overrides \
            --extra-facts .cache/metabolic-source-facts/chembl/evidence_facts.json \
            --extra-facts .cache/metabolic-source-facts/pharmgkb/evidence_facts.json

      - name: Stream source overlays into static API
        shell: bash
        run: |
          set -euo pipefail
          python tools/export_dose_overlay.py \
            --api-dir public/api \
            --max-content-per-substance "${MAX_CONTENT_PER_SUBSTANCE}" \
            --fact-json .cache/metabolic-source-facts/openfda_label/evidence_facts.json \
            --fact-json .cache/metabolic-source-facts/dailymed/evidence_facts.json \
            --fact-json .cache/metabolic-source-facts/chembl/evidence_facts.json \
            --fact-json .cache/metabolic-source-facts/foodrugs/evidence_facts.json \
            --fact-json .cache/metabolic-source-facts/onsides/evidence_facts.json \
            --fact-json .cache/metabolic-source-facts/pharmgkb/evidence_facts.json

      - name: Copy search web UI
        shell: bash
        run: cp -R site/. public/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
