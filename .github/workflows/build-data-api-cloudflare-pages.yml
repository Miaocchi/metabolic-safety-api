name: Build Static Drug API to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      max_content_per_substance:
        description: "Maximum content/signal/PGx rows exported per substance; 0 exports all"
        required: true
        default: "24"

permissions:
  contents: read
  deployments: write

concurrency:
  group: "cloudflare-pages-drug-api"
  cancel-in-progress: false

env:
  DEFAULT_MAX_CONTENT_PER_SUBSTANCE: "24"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and deploy static API
    env:
      MAX_CONTENT_PER_SUBSTANCE: ${{ github.event_name == 'workflow_dispatch' && inputs.max_content_per_substance || '24' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: python -m pip install -e .

      - name: Test ETL
        run: python -m unittest discover -s tests

      - name: Build fused seed database and static API
        shell: bash
        run: |
          set -euo pipefail
          python -m metabolic_safety_etl.cli build-public-api \
            --ddinter-dir data/raw/ddinter \
            --out build \
            --api-out public/api \
            --max-public-terms 120 \
            --public-limit 2 \
            --public-workers 8 \
            --psychonautwiki-pages 3 \
            --extra-facts data/optional \
            --extra-facts data/overrides

      - name: Export seed-backed overlays into static API
        shell: bash
        run: |
          set -euo pipefail
          echo "Cloudflare Pages workflow exports overlays from build/app_seed.sqlite only."
          echo "Use build-data-api.yml for full source-layer overlays from openFDA/DailyMed/FooDrugs/OnSIDES/PharmGKB caches."
          python tools/export_dose_overlay.py \
            --api-dir public/api \
            --max-content-per-substance "${MAX_CONTENT_PER_SUBSTANCE}" \
            --structured-db build/app_seed.sqlite

      - name: Copy search web UI
        shell: bash
        run: |
          cp -R site/. public/
          cat > public/_headers <<'HEADERS'
          /api/*
            Access-Control-Allow-Origin: *
            Access-Control-Allow-Methods: GET, HEAD, OPTIONS
            Access-Control-Max-Age: 86400
            Cache-Control: public, max-age=3600
          /api/manifest.json
            Access-Control-Allow-Origin: *
            Cache-Control: no-cache
          HEADERS

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'metabolic-safety-api' }}
        shell: bash
        run: |
          npx wrangler@latest pages project create "$PROJECT_NAME" --production-branch=main || true
          npx wrangler@latest pages deploy public --project-name="$PROJECT_NAME" --branch=main
