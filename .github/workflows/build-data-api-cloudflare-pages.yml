name: Build Static Drug API to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: "cloudflare-pages-drug-api"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and deploy static API
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: python -m pip install -e .

      - name: Test ETL
        run: python -m unittest discover -s tests

      - name: Build fused seed database and static API
        shell: bash
        run: |
          set -euo pipefail
          python -m metabolic_safety_etl.cli build-public-api \
            --ddinter-dir data/raw/ddinter \
            --out build \
            --api-out public/api \
            --max-public-terms 120 \
            --public-limit 2 \
            --public-workers 8 \
            --psychonautwiki-pages 3

      - name: Copy search web UI
        shell: bash
        run: |
          cp -R site/. public/
          cat > public/_headers <<'HEADERS'
          /api/*
            Access-Control-Allow-Origin: *
            Access-Control-Allow-Methods: GET, HEAD, OPTIONS
            Access-Control-Max-Age: 86400
            Cache-Control: public, max-age=3600
          /api/manifest.json
            Access-Control-Allow-Origin: *
            Cache-Control: no-cache
          HEADERS

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'metabolic-safety-api' }}
        shell: bash
        run: |
          npx wrangler@latest pages project create "$PROJECT_NAME" --production-branch=main || true
          npx wrangler@latest pages deploy public --project-name="$PROJECT_NAME" --branch=main
