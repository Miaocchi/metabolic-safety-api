name: Quality Gate

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "data/**"
      - "mobile_pwa/**"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - ".github/workflows/quality-gate.yml"
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "data/**"
      - "mobile_pwa/**"
      - "package.json"
      - "package-lock.json"
      - "pyproject.toml"
      - ".github/workflows/quality-gate.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Python ETL and PWA checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            mobile_pwa/package-lock.json

      - name: Install Python package
        run: python -m pip install -e .

      - name: Install root npm dependencies
        run: npm ci

      - name: Install PWA npm dependencies
        run: npm ci --prefix mobile_pwa

      - name: Check generated output boundaries
        run: npm run repo:check-generated

      - name: Test Python ETL
        run: npm run data:test

      - name: Test PWA
        run: npm run mobile:test

      - name: Build PWA
        run: npm run mobile:build
